<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for modern UI -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#0a0f1c;stop-opacity:0.98"/>
    </linearGradient>
    
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1a2332;stop-opacity:0.95"/>
    </linearGradient>
    
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffb300;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Glassmorphism effect -->
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#0a0f1c"/>
  
  <!-- Game Map Area (placeholder) -->
  <rect x="0" y="60" width="900" height="740" fill="#1a2332" opacity="0.3"/>
  <text x="450" y="430" text-anchor="middle" font-size="24" fill="#4a90e2" opacity="0.6">Hex Map Rendering Area</text>
  <text x="450" y="460" text-anchor="middle" font-size="16" fill="#4a90e2" opacity="0.4">Enhanced terrain visualization with modern graphics</text>
  
  <!-- Top Header/HUD -->
  <rect width="1200" height="60" fill="url(#headerGradient)" filter="url(#blur)"/>
  <rect width="1200" height="60" fill="url(#headerGradient)"/>
  
  <!-- Player Resources in Header -->
  <g transform="translate(20, 15)">
    <!-- Gold -->
    <rect x="0" y="0" width="80" height="30" rx="15" fill="#ffd700" opacity="0.2"/>
    <text x="8" y="20" font-size="14" fill="#ffd700">💰 1,250</text>
    
    <!-- Science -->
    <rect x="90" y="0" width="80" height="30" rx="15" fill="#4a90e2" opacity="0.2"/>
    <text x="98" y="20" font-size="14" fill="#4a90e2">🔬 85</text>
    
    <!-- Production -->
    <rect x="180" y="0" width="80" height="30" rx="15" fill="#ff7043" opacity="0.2"/>
    <text x="188" y="20" font-size="14" fill="#ff7043">⚙️ 42</text>
    
    <!-- Food -->
    <rect x="270" y="0" width="80" height="30" rx="15" fill="#4caf50" opacity="0.2"/>
    <text x="278" y="20" font-size="14" fill="#4caf50">🌾 28</text>
  </g>
  
  <!-- Turn Info -->
  <g transform="translate(450, 15)">
    <text x="0" y="20" font-size="16" fill="#fff" font-weight="bold">Turn 127 - Ancient Era</text>
    <text x="200" y="20" font-size="14" fill="#4a90e2">Player: Alexander the Great</text>
  </g>
  
  <!-- Header Actions -->
  <g transform="translate(850, 10)">
    <!-- End Turn Button -->
    <rect x="0" y="0" width="120" height="40" rx="20" fill="url(#buttonGradient)" filter="url(#glow)"/>
    <text x="60" y="26" text-anchor="middle" font-size="16" fill="#1a2332" font-weight="bold">End Turn</text>
    
    <!-- Settings -->
    <circle cx="150" cy="20" r="18" fill="#2d3748" stroke="#4a90e2" stroke-width="2"/>
    <text x="150" y="26" text-anchor="middle" font-size="14" fill="#4a90e2">⚙️</text>
    
    <!-- Menu -->
    <circle cx="200" cy="20" r="18" fill="#2d3748" stroke="#4a90e2" stroke-width="2"/>
    <text x="200" y="26" text-anchor="middle" font-size="14" fill="#4a90e2">☰</text>
  </g>
  
  <!-- Right Sidebar -->
  <rect x="900" y="60" width="300" height="740" fill="url(#panelGradient)" filter="url(#blur)"/>
  <rect x="900" y="60" width="300" height="740" fill="url(#panelGradient)"/>
  
  <!-- Sidebar Content -->
  <g transform="translate(920, 80)">
    <!-- Unit Information Panel -->
    <text x="0" y="20" font-size="18" fill="#ffd700" font-weight="bold">Selected Unit</text>
    <rect x="0" y="30" width="260" height="120" rx="10" fill="#1a2332" opacity="0.7"/>
    
    <!-- Unit Details -->
    <g transform="translate(10, 45)">
      <circle cx="25" cy="25" r="20" fill="#4a90e2" stroke="#ffd700" stroke-width="2"/>
      <text x="25" y="31" text-anchor="middle" font-size="16" fill="#fff">⚔️</text>
      
      <text x="55" y="20" font-size="16" fill="#fff" font-weight="bold">Warrior</text>
      <text x="55" y="38" font-size="12" fill="#4a90e2">Movement: 2/2</text>
      
      <!-- Health Bar -->
      <rect x="55" y="45" width="80" height="8" rx="4" fill="#2d3748"/>
      <rect x="55" y="45" width="60" height="8" rx="4" fill="#4caf50"/>
      <text x="140" y="52" font-size="10" fill="#4caf50">75/100 HP</text>
      
      <!-- Action Buttons -->
      <rect x="10" y="65" width="60" height="25" rx="12" fill="#4a90e2" opacity="0.8"/>
      <text x="40" y="80" text-anchor="middle" font-size="12" fill="#fff">Move</text>
      
      <rect x="80" y="65" width="60" height="25" rx="12" fill="#f44336" opacity="0.8"/>
      <text x="110" y="80" text-anchor="middle" font-size="12" fill="#fff">Attack</text>
      
      <rect x="150" y="65" width="60" height="25" rx="12" fill="#ff7043" opacity="0.8"/>
      <text x="180" y="80" text-anchor="middle" font-size="12" fill="#fff">Fortify</text>
    </g>
    
    <!-- City Information Panel -->
    <text x="0" y="180" font-size="18" fill="#ffd700" font-weight="bold">Nearest City</text>
    <rect x="0" y="190" width="260" height="180" rx="10" fill="#1a2332" opacity="0.7"/>
    
    <g transform="translate(10, 205)">
      <text x="0" y="20" font-size="16" fill="#fff" font-weight="bold">🏛️ Athens</text>
      <text x="0" y="38" font-size="12" fill="#4a90e2">Population: 5 (+2 growth)</text>
      
      <!-- Production Queue -->
      <text x="0" y="60" font-size="14" fill="#ff7043" font-weight="bold">Production Queue</text>
      <rect x="0" y="70" width="240" height="20" rx="10" fill="#2d3748"/>
      <rect x="0" y="70" width="120" height="20" rx="10" fill="#ff7043"/>
      <text x="120" y="83" text-anchor="middle" font-size="11" fill="#fff">Granary (8/15 🔨)</text>
      
      <!-- City Resources -->
      <g transform="translate(0, 105)">
        <text x="0" y="15" font-size="12" fill="#4caf50">🌾 Food: +8</text>
        <text x="80" y="15" font-size="12" fill="#ff7043">⚙️ Prod: +5</text>
        <text x="160" y="15" font-size="12" fill="#ffd700">💰 Gold: +12</text>
        <text x="0" y="35" font-size="12" fill="#4a90e2">🔬 Science: +6</text>
        <text x="80" y="35" font-size="12" fill="#9c27b0">🎭 Culture: +4</text>
      </g>
      
      <!-- Quick Actions -->
      <rect x="0" y="135" width="115" height="25" rx="12" fill="#4a90e2" opacity="0.8"/>
      <text x="57" y="150" text-anchor="middle" font-size="12" fill="#fff">Manage City</text>
      
      <rect x="125" y="135" width="115" height="25" rx="12" fill="#4caf50" opacity="0.8"/>
      <text x="182" y="150" text-anchor="middle" font-size="12" fill="#fff">Build Queue</text>
    </g>
    
    <!-- Technology Tree Preview -->
    <text x="0" y="400" font-size="18" fill="#ffd700" font-weight="bold">Current Research</text>
    <rect x="0" y="410" width="260" height="100" rx="10" fill="#1a2332" opacity="0.7"/>
    
    <g transform="translate(10, 425)">
      <circle cx="25" cy="25" r="20" fill="#4a90e2" stroke="#ffd700" stroke-width="2"/>
      <text x="25" y="31" text-anchor="middle" font-size="14" fill="#fff">🏺</text>
      
      <text x="55" y="20" font-size="16" fill="#fff" font-weight="bold">Pottery</text>
      <text x="55" y="38" font-size="12" fill="#4a90e2">Progress: 45/80 🔬</text>
      
      <!-- Progress Bar -->
      <rect x="55" y="45" width="120" height="8" rx="4" fill="#2d3748"/>
      <rect x="55" y="45" width="68" height="8" rx="4" fill="#4a90e2"/>
      <text x="180" y="52" font-size="10" fill="#4a90e2">6 turns</text>
      
      <rect x="10" y="65" width="100" height="25" rx="12" fill="#4a90e2" opacity="0.8"/>
      <text x="60" y="80" text-anchor="middle" font-size="12" fill="#fff">Tech Tree</text>
      
      <rect x="120" y="65" width="100" height="25" rx="12" fill="#9c27b0" opacity="0.8"/>
      <text x="170" y="80" text-anchor="middle" font-size="12" fill="#fff">Change Focus</text>
    </g>
    
    <!-- Minimap -->
    <text x="0" y="540" font-size="18" fill="#ffd700" font-weight="bold">Strategic Map</text>
    <rect x="0" y="550" width="260" height="180" rx="10" fill="#1a2332" opacity="0.7"/>
    
    <!-- Simplified minimap representation -->
    <g transform="translate(10, 560)">
      <rect width="240" height="160" fill="#0a0f1c"/>
      <!-- Terrain indicators -->
      <circle cx="50" cy="40" r="8" fill="#7cb342" opacity="0.8"/>
      <circle cx="80" cy="60" r="6" fill="#1976d2" opacity="0.8"/>
      <circle cx="120" cy="30" r="10" fill="#795548" opacity="0.8"/>
      <circle cx="180" cy="80" r="7" fill="#ffb74d" opacity="0.8"/>
      
      <!-- Cities and units -->
      <rect x="46" y="36" width="8" height="8" fill="#ffd700"/>
      <circle cx="178" cy="78" r="3" fill="#4a90e2"/>
      
      <!-- View indicator -->
      <rect x="80" y="50" width="40" height="30" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="3,2"/>
    </g>
  </g>
  
  <!-- Bottom Action Panel -->
  <rect x="0" y="700" width="900" height="100" fill="url(#panelGradient)" filter="url(#blur)"/>
  <rect x="0" y="700" width="900" height="100" fill="url(#panelGradient)"/>
  
  <!-- Action Panel Content -->
  <g transform="translate(20, 720)">
    <text x="0" y="20" font-size="16" fill="#ffd700" font-weight="bold">Quick Actions</text>
    
    <!-- Action buttons -->
    <rect x="0" y="30" width="80" height="40" rx="20" fill="#4a90e2" opacity="0.8"/>
    <text x="40" y="54" text-anchor="middle" font-size="12" fill="#fff">🏛️ Cities</text>
    
    <rect x="90" y="30" width="80" height="40" rx="20" fill="#4caf50" opacity="0.8"/>
    <text x="130" y="54" text-anchor="middle" font-size="12" fill="#fff">⚔️ Units</text>
    
    <rect x="180" y="30" width="80" height="40" rx="20" fill="#9c27b0" opacity="0.8"/>
    <text x="220" y="54" text-anchor="middle" font-size="12" fill="#fff">🔬 Tech</text>
    
    <rect x="270" y="30" width="80" height="40" rx="20" fill="#ff7043" opacity="0.8"/>
    <text x="310" y="54" text-anchor="middle" font-size="12" fill="#fff">🎭 Culture</text>
    
    <rect x="360" y="30" width="80" height="40" rx="20" fill="#f44336" opacity="0.8"/>
    <text x="400" y="54" text-anchor="middle" font-size="12" fill="#fff">⚖️ Civics</text>
    
    <rect x="450" y="30" width="80" height="40" rx="20" fill="#ff9800" opacity="0.8"/>
    <text x="490" y="54" text-anchor="middle" font-size="12" fill="#fff">🤝 Diplo</text>
    
    <rect x="540" y="30" width="80" height="40" rx="20" fill="#607d8b" opacity="0.8"/>
    <text x="580" y="54" text-anchor="middle" font-size="12" fill="#fff">💼 Trade</text>
    
    <rect x="630" y="30" width="80" height="40" rx="20" fill="#795548" opacity="0.8"/>
    <text x="670" y="54" text-anchor="middle" font-size="12" fill="#fff">📊 Reports</text>
  </g>
  
  <!-- Modern UI Elements Labels -->
  <g transform="translate(50, 50)" opacity="0.7">
    <text x="0" y="0" font-size="12" fill="#4a90e2">• Glassmorphism Effects</text>
    <text x="0" y="20" font-size="12" fill="#4a90e2">• Dark Theme with Gold Accents</text>
    <text x="0" y="40" font-size="12" fill="#4a90e2">• Modern Typography (Inter/Roboto)</text>
  </g>
  
  <g transform="translate(950, 50)" opacity="0.7">
    <text x="0" y="0" font-size="12" fill="#4a90e2">• Contextual Information Panels</text>
    <text x="0" y="20" font-size="12" fill="#4a90e2">• Real-time Resource Tracking</text>
    <text x="0" y="40" font-size="12" fill="#4a90e2">• Interactive Progress Indicators</text>
  </g>
  
  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" font-size="20" fill="#ffd700" font-weight="bold">Modern Civilization Game UI - Enhanced Design</text>
</svg>