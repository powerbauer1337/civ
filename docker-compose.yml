version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: civ-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: civilization_game
      POSTGRES_USER: civ_user
      POSTGRES_PASSWORD: civ_password_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - civ-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civ_user -d civilization_game"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: civ-redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password_dev --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - civ-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Game Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: civ-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://civ_user:civ_password_dev@postgres:5432/civilization_game
      REDIS_URL: redis://:redis_password_dev@redis:6379/0
      JWT_SECRET: dev_jwt_secret_change_in_production
      SESSION_SECRET: dev_session_secret_change_in_production
      ENABLE_CORS_CREDENTIALS: "true"
      ENABLE_SECURITY_HEADERS: "true"
      RATE_LIMIT_MAX_REQUESTS: "100"
      RATE_LIMIT_WINDOW_MS: "60000"
      REQUEST_TIMEOUT_MS: "30000"
      ENABLE_DEBUG_ENDPOINTS: "false"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - civ-network
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Client (Development)
  client:
    image: node:20-alpine
    container_name: civ-client
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:3001
      VITE_SOCKET_URL: http://localhost:3001
    ports:
      - "3000:5173"
    volumes:
      - ./client:/app/client
      - ./shared:/app/shared
      - ./package.json:/app/package.json
      - client_node_modules:/app/client/node_modules
      - shared_node_modules:/app/shared/node_modules
    networks:
      - civ-network
    depends_on:
      - server

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: civ-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
      - client
    networks:
      - civ-network
    profiles:
      - production

networks:
  civ-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  client_node_modules:
    driver: local
  shared_node_modules:
    driver: local
